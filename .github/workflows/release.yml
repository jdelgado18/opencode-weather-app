name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Leer versión
        id: version
        run: echo "version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar binario
        run: bun run build

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe; se omite."
            exit 0
          fi
          gh release create "$TAG" ./weather --title "$TAG" --generate-notes
